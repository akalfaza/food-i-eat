<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Camera Roll Zine</title>
      <link rel="stylesheet" href="style.css" />
</head>

<body>

      <div class="gallery" id="gallery"></div>

      <div class="statsOverlay" id="statsOverlay"></div>

      <div class="hoverPreview" id="hoverPreview">
            <img id="hoverPreviewImg" src="" alt="">
      </div>

      <div id="caterpillar-wrap">
            <img id="caterpillar" src="cat-img/cat_1.png" alt="Walking caterpillar">
      </div>

      <aside class="storyPanel" id="storyPanel">
            <div class="storyMover" id="storyMover">
                  <div class="storyInner" id="storyInner"></div>
            </div>
      </aside>

      <script src="data.js"></script>
      <script src="script.js"></script>
      <script>
            const frames = [
                  "cat-img/cat_1.png",
                  "cat-img/cat_2.png",
                  "cat-img/cat_3.png",
                  "cat-img/cat_4.png",
                  "cat-img/cat_5.png",
                  "cat-img/cat_6.png"
            ];
const caterpillar = document.getElementById("caterpillar");
  const wrap = document.getElementById("caterpillar-wrap");

  let frameIndex = 0;
  let direction = 1;
  let pos = 20;
  let speed = 0.6;

  // frame animation
  setInterval(() => {
    frameIndex = (frameIndex + 1) % frames.length;
    caterpillar.src = frames[frameIndex];
  }, 1000);

  function animateCaterpillar() {
    const isMobile = window.innerWidth <= 899;

    if (isMobile) {
      const caterpillarWidth = wrap.offsetWidth;
      const minX = 20;
      const maxX = window.innerWidth - caterpillarWidth - 20;

      pos += speed * direction;

      if (pos >= maxX) {
        pos = maxX;
        direction = -1;
      }

      if (pos <= minX) {
        pos = minX;
        direction = 1;
      }

      wrap.style.left = pos + "px";
      wrap.style.top = "8px";
      wrap.style.right = "auto";

      if (direction === 1) {
        caterpillar.style.transform = "rotate(0deg)";
      } else {
        caterpillar.style.transform = "rotate(180deg)";
      }

    } else {
      const caterpillarHeight = wrap.offsetHeight;
      const minY = 20;
      const maxY = window.innerHeight - caterpillarHeight - 20;

      pos += speed * direction;

      if (pos >= maxY) {
        pos = maxY;
        direction = -1;
      }

      if (pos <= minY) {
        pos = minY;
        direction = 1;
      }

      wrap.style.top = pos + "px";
      wrap.style.right = "-20px";
      wrap.style.left = "auto";

      if (direction === 1) {
        caterpillar.style.transform = "rotate(90deg)";
      } else {
        caterpillar.style.transform = "rotate(-90deg)";
      }
    }

    requestAnimationFrame(animateCaterpillar);
  }

  // reset position when screen size changes
  function resetPosition() {
    pos = 20;
  }

  window.addEventListener("resize", resetPosition);

  animateCaterpillar();
      </script>

</body>

</html>
